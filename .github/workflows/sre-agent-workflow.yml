name: Request SRE Agent Remediation
 
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
 
permissions:
  id-token: write
  contents: read
 
jobs:
  request-remediation:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      !startsWith(github.event.workflow_run.head_branch, 'sre-agent/')
    runs-on: ubuntu-latest
 
    steps:
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
 
      - name: Request CI remediation
        env:
          SRE_TRIGGER_URL: ${{ secrets.SRE_TRIGGER_URL }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          TOKEN="$(az account get-access-token \
            --resource 59f0a04a-b322-4310-adc9-39ac41e9631e \
            --query accessToken -o tsv)"
 
          jq -n \
            --arg repository "$REPOSITORY" \
            --arg workflow "$WORKFLOW" \
            --arg run_id "$RUN_ID" \
            --arg run_url "$RUN_URL" \
            --arg branch "$BRANCH" \
            --arg sha "$SHA" \
            --arg conclusion "$CONCLUSION" \
            '{repository: $repository, workflow: $workflow, run_id: $run_id,
              run_url: $run_url, branch: $branch, sha: $sha,
              conclusion: $conclusion}' \
          | curl --fail-with-body --silent --show-error \
              -X POST "$SRE_TRIGGER_URL" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary @-
